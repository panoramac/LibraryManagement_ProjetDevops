<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un Livre</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <a class="navbar-brand" href="#">Gestion Bibliothèque</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link" href="index.html">Liste des Livres</a>
            </li>
            <li class="nav-item active">
                <a class="nav-link" href="add.html">Ajouter un Livre <span class="sr-only">(current)</span></a>
            </li>
        </ul>
    </div>
</nav>
<div class="container">
    <h1>Ajouter un Livre</h1>
    <hr>
    <form id="addUserForm">
        <div class="form-group">
            <label for="isbn">ISBN:</label>
            <input type="number" class="form-control" id="isbn" name="isbn" required>
        </div>
        <div class="form-group">
            <label for="nom">Titre:</label>
            <input type="text" class="form-control" id="nom" name="nom" required>
        </div>
        <div class="form-group">
            <label for="auteur">Auteur:</label>
            <input type="text" class="form-control" id="auteur" name="auteur" required>
        </div>
        <div class="form-group">
            <label for="prix">Prix (€):</label>
            <input type="number" step="0.01" class="form-control" id="prix" name="prix" required>
        </div>
        <button type="submit" class="btn btn-primary">Ajouter le Livre</button>
        <a href="index.html" class="btn btn-secondary">Retour à la liste</a>
    </form>
</div>

<!-- Bootstrap JS and jQuery -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<script>
    document.getElementById('addUserForm').addEventListener('submit', function (event) {
        event.preventDefault();

        // Récupérer les valeurs du formulaire
        const livreData = {
            isbn: parseInt(document.getElementById('isbn').value),
            nom: document.getElementById('nom').value,
            auteur: document.getElementById('auteur').value,
            prix: parseFloat(document.getElementById('prix').value),
            disponible: true
        };

        console.log('Données envoyées:', livreData);

        // Send POST request to add book
        fetch('http://localhost:9090/livre', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(livreData)
        })
            .then(response => {
                console.log('Response status:', response.status);
                if (!response.ok) {
                    return response.text().then(text => {
                        throw new Error(text || 'Erreur serveur');
                    });
                }
                return response.json();
            })
            .then(addedLivre => {
                console.log('Livre ajouté:', addedLivre);
                alert('Livre ajouté avec succès!');
                document.getElementById('addUserForm').reset();

                // Redirection automatique après 1 seconde
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            })
            .catch(error => {
                console.error('Error adding book:', error);
                alert('Erreur lors de l\'ajout du livre: ' + error.message);
            });
    });
</script>
</body>

</html>
